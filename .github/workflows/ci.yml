name: CI

# The correctness gate. This workflow answers exactly one question: do the proofs
# still check? Nothing in it talks to GitHub Pages, so a documentation hosting
# problem can never turn this red.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commits often land in bursts. Superseding runs on the same ref keeps the queue
# short and stops a 20 minute build from being spent on a commit already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and audit axioms
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Install the toolchain and fetch caches only. The build itself runs in
      # the next two steps, so that it can be ordered.
      - uses: leanprover/lean-action@v1
        with:
          # Pull prebuilt Mathlib olean files instead of compiling Mathlib from
          # source. Detection is automatic, but this project always needs it, so
          # say it outright rather than depending on the heuristic.
          use-mathlib-cache: true
          build: false

      # The default library. It leaves out the three memory-heavy check
      # modules, so this is the build a laptop runs.
      - name: Build the default library
        run: lake build

      # The library WideTrailHeavy adds three check modules that evaluate whole
      # 16-wide permutations in the kernel; each needs 7 to 12 GB of memory to
      # elaborate. Lake builds independent modules in parallel and has no option
      # to limit that, so together they exceed the runner's 16 GB and the runner
      # is shut down. Building them one at a time keeps the peak to one of them.
      - name: Build the memory-heavy checks one at a time
        run: |
          lake build WideTrail.Poseidon2.Checks.KoalaBear
          lake build WideTrail.Poseidon2.Checks.BabyBear
          lake build WideTrail.Poseidon2.Checks.Plonky3
          lake build WideTrailHeavy

      - uses: leanprover/lean-action@v1
        with:
          # Everything is built. Restoring the GitHub cache now could replace
          # fresh build outputs with older ones, so it stays off here.
          use-mathlib-cache: false
          use-github-cache: false
          build: false

          # Retain the action's namespace audit (of the default library) alongside
          # the complete module audits below. Unexpected transitive axioms include
          # `sorry` and `admit` (which surface as `sorryAx`), `native_decide`
          # (which surfaces as `Lean.ofReduceBool` and moves the evidence out of
          # the kernel), and any home-rolled axiom, including ones arriving
          # through imports. Each layer also pins named theorem footprints.
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Audit every declaration of the default library by defining module
        run: lake env lean scripts/AuditAxioms.lean

      - name: Audit every declaration, heavy checks included, by defining module
        run: lake env lean scripts/AuditAxiomsHeavy.lean

      # The builds and the audits above cover only modules that WideTrail.lean
      # or WideTrailHeavy.lean imports. A file that nothing imports would be
      # neither compiled nor audited, and no step would notice.
      - name: Check that every module is imported
        run: python3 scripts/check_imports.py
